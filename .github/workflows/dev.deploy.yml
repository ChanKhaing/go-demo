name: Dev Build

on:
  push:
    branches:
      - 'dev-*'
    paths:
      - 'ecs-backend/**'
      - 'ecs-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed service
        id: detect
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          case $BRANCH in
            dev-ecs-backend) echo "dir=04-ecs-backend" >> $GITHUB_OUTPUT ;;
            *)             echo "dir=." >> $GITHUB_OUTPUT ;;
          esac

      - name: Build Docker image
        run: |
          docker build -t test-${{ steps.detect.outputs.dir }}:${{ github.sha }} \
            ./${{ steps.detect.outputs.dir }}
          echo "✅ Build successful: ${{ steps.detect.outputs.dir }}"