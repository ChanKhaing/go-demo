name: Dev Manual Build to Docker Hub

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Docker Hub ဆီ တင်မယ့် Service'
        required: true
        type: choice
        options:
          - all
          - go-api
          - rust-api
          - python-api

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        env:
          SERVICE: ${{ github.event.inputs.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deploy() {
            DIR=$1
            REPO=$2
            echo "🚀 Pushing $REPO to Docker Hub..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/$REPO:$IMAGE_TAG ./$DIR
            docker push ${{ secrets.DOCKER_USERNAME }}/$REPO:$IMAGE_TAG
          }

          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "go-api" ]; then deploy "01-go-api" "go-api"; fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "rust-api" ]; then deploy "02-rust-api" "rust-api"; fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "python-api" ]; then deploy "03-python-api" "python-api"; fi