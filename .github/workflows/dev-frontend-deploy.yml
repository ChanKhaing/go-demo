name: Dev Frontend Deploy to Docker Hub

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend to Docker Hub
        env:
          VITE_API_URL: "ecs-service-alb-1778369978.ap-southeast-2.elb.amazonaws.com"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🚀 Building Frontend for Dev..."
          
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-frontend:$IMAGE_TAG \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-frontend:latest \
            ./ecs-frontend
            
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-frontend:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-frontend:latest